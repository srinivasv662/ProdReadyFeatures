spring.application.name=prod-ready-features

spring.datasource.url=jdbc:mysql://localhost:3306/prod-ready-features?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.devtools.restart.enabled=true
spring.devtools.restart.exclude=src/main/java/com/company/sri/prod_ready_features/prod_ready_features/dto/**

server.port=9000

employeeService.base.url=http://localhost:8080/

#logging configuration
#logging.level.com.company.sri.prod_ready_features.prod_ready_features.clients=DEBUG
logging.level.com.company.sri.prod_ready_features.prod_ready_features.clients=TRACE
logging.level.com.company.sri.prod_ready_features.prod_ready_features.config=INFO
#logging.level.root=debug
#logging.level.root=trace
logging.pattern.console=%d{dd-mm-yyyy hh:mm:ss} [%level] [%c{2}] --- %m%n
logging.file.name=application.log
#logging.config=classpath:logback-spring.xml

#actuatr configuration
management.endpoints.web.exposure.include=*
management.info.env.enabled=true
info.abcd=pqrs
info.app.author=Srinivas V
info.app.version=1.0.0
info.app.documentation=https://google.com/docs

#https://docs.spring.io/spring-boot/reference/actuator/endpoints.html#actuator.endpoints.sanitization
#management.endpoint.env.show-values=when-authorized
#management.endpoint.env.roles=admin
management.endpoint.env.show-values=always
management.info.build.enabled=true
management.info.git.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

#https://springdoc.org/#springdoc-openapi-core-properties
#https://springdoc.org/#swagger-ui-properties
springdoc.api-docs.enabled=true
#springdoc.packages-to-exclude=com.company.sri.prod_ready_features.prod_ready_features.controllers